name: Retest live desktop
on:
  push:
    branches: [desktop-vm-check]
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hafthiOS-prototype
          run-id: 37001058162
          github-token: ${{ github.token }}
          path: out
      - name: Retest existing ISO with accelerated graphics
        run: |
          rm -f out/boot-screen.ppm out/guide-screen.ppm out/desktop-screen.ppm out/chrome-screen.ppm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-gui python3-pil xvfb xauth xdotool libgl1-mesa-dri mesa-utils
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1920x1200x24" python3 scripts/test-boot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-retest-preview
          path: |
            out/*.ppm
            out/*.png
            out/*.log
            out/size.txt
          retention-days: 3
