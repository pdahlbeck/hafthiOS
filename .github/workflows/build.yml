name: Build prototype ISO
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      iso_run_id:
        description: 'Existing build run to retest (blank builds a new ISO)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  greeter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render coastal greeter before building
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo gir1.2-gtk-3.0 python3-pil xvfb xauth xdotool
          xvfb-run -a -s "-screen 0 1440x900x24" python3 scripts/preview-greeter.py
      - name: Upload coastal greeter review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hafthiOS-coastal-greeter
          path: out/coastal-greeter.*
          retention-days: 14
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download existing Hafthi OS for package installation test
        uses: actions/download-artifact@v4
        with:
          name: hafthiOS-prototype
          path: package-source
          github-token: ${{ github.token }}
          run-id: 37428040559
      - name: Install signed packages in extracted Hafthi OS before building an ISO
        run: |
          set -o pipefail
          docker run --rm --privileged \
            -v "$PWD:/project" -w /project archlinux:base \
            bash -lc 'pacman -Syu --noconfirm arch-install-scripts squashfs-tools libisoburn && bash scripts/test-pacman.sh package-source/*.iso' \
            2>&1 | tee pacman-install-test.log
      - name: Upload package installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hafthiOS-pacman-test
          path: pacman-install-test.log
          retention-days: 14
  iso:
    needs: [packages, greeter]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check prototype
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile live/usr/local/bin/hafthios-welcome live/usr/local/bin/hafthios-greeter
          bash -n scripts/build-iso.sh live/usr/local/bin/hafthios-session live/usr/local/bin/hafthios-installed-session live/root/.bash_profile
      - name: Select existing ISO for test-only changes
        id: source_iso
        env:
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
          DISPATCH_RUN: ${{ inputs.iso_run_id }}
        run: |
          python3 - <<'PY'
          import os, re
          match = re.search(r'\[retest-iso:(\d+)\]', os.environ.get('PUSH_MESSAGE', ''))
          run_id = os.environ.get('DISPATCH_RUN', '') or (match.group(1) if match else '')
          if run_id and not run_id.isdecimal():
              raise SystemExit('ISO run ID must be numeric')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('run_id=' + run_id + '\n')
          PY
      - name: Download existing ISO without rebuilding it
        if: steps.source_iso.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: hafthiOS-prototype
          path: out
          github-token: ${{ github.token }}
          run-id: ${{ steps.source_iso.outputs.run_id }}
      - name: Clear previous VM diagnostics
        if: steps.source_iso.outputs.run_id != ''
        env:
          ISO_SOURCE_RUN: ${{ steps.source_iso.outputs.run_id }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for path in Path('out').iterdir():
              if path.suffix in ('.ppm', '.png', '.log'):
                  path.unlink()
          Path('out/iso-source.txt').write_text('Original ISO build run: ' + os.environ['ISO_SOURCE_RUN'] + '\n')
          PY
      - name: Build with official Archiso in an isolated container
        if: steps.source_iso.outputs.run_id == ''
        run: |
          docker run --rm --privileged \
            -v "$PWD:/project" -w /project archlinux:base \
            bash -lc 'pacman -Syu --noconfirm archiso grub python mtools mkinitcpio rust git pkgconf wayland libxkbcommon systemd-libs alsa-lib && bash scripts/build-iso.sh'
          sudo chown -R "$(id -u):$(id -g)" out
      - name: Boot graphical prototype in a disposable VM
        env:
          HAFTHIOS_RETEST_ISO: ${{ steps.source_iso.outputs.run_id }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-gui xorriso python3-pil ovmf tesseract-ocr xvfb xauth xdotool libgl1-mesa-dri mesa-utils
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1920x1200x24" python3 scripts/test-boot.py
      - name: Report ISO size
        run: cat out/size.txt
      - name: Upload complete file register
        uses: actions/upload-artifact@v4
        with:
          name: hafthiOS-file-register
          path: |
            out/hafthios-file-register.csv
            out/hafthios-file-register.sqlite
            out/file-register-summary.txt
          retention-days: 14
      - name: Upload VM preview and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hafthiOS-preview
          path: |
            out/boot-screen.ppm
            out/coastal-greeter.png
            out/coastal-greeter.log
            out/splash-screen.png
            out/boot-details.ppm
            out/guide-screen.ppm
            out/settings-screen.ppm
            out/desktop-screen.ppm
            out/chrome-screen.ppm
            out/boot-serial.log
            out/qemu.log
            out/installer-*.ppm
            out/installed-*.ppm
            out/installed-*.log
            out/size.txt
            out/iso-source.txt
            out/*file-register*
          retention-days: 14
      - name: Upload bootable prototype
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hafthiOS-prototype
          path: |
            out/*.iso
            out/*.sha256
            out/size.txt
            out/iso-source.txt
            out/*file-register*
            out/boot-screen.ppm
            out/splash-screen.png
            out/boot-details.ppm
            out/guide-screen.ppm
            out/settings-screen.ppm
            out/desktop-screen.ppm
            out/chrome-screen.ppm
            out/boot-serial.log
            out/qemu.log
            out/installer-*.ppm
            out/installed-*.ppm
            out/installed-*.log
          compression-level: 0
          retention-days: 14
